<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Une petite surprise d'anniversaire pour Rose.">
  <title>Une surprise pour Rose</title>
  <link rel="stylesheet" href="revers/style_debut.css?v=mobile-2">
</head>
<body>
  <main class="welcome">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <div class="intro">
      <p class="eyebrow"><span aria-hidden="true">✦</span> Une surprise pour Rose <span aria-hidden="true">✦</span></p>
      <h1>Joyeux anniversaire,<br><span>mon amour</span></h1>
      <p class="lead">J’ai préparé quelque chose juste pour toi. Prête à découvrir ton cadeau ?</p>
    </div>

    <div class="gift-stage">
      <div class="btn">
        <div class="btn-back">
          <p>Tu aimes ton cadeau ?</p>
          <div class="choices">
            <button class="yes" type="button" onclick="window.location.href='annive_rose.html'">OUI !!! <span aria-hidden="true">♥</span></button>
            <button class="no" type="button">Non</button>
          </div>
        </div>
        <button class="btn-front" type="button" aria-label="Ouvrir ton cadeau">
          <span class="front-heart" aria-hidden="true">♥</span>
          <span class="front-title">Ton cadeau t’attend</span>
          <span class="front-hint">Clique pour l’ouvrir <span aria-hidden="true">↗</span></span>
        </button>
      </div>
      <p class="description">Un petit moment rien que pour toi <span aria-hidden="true">✨</span></p>
    </div>

    <p class="signature">Avec tout mon amour, pour Rose <span aria-hidden="true">♥</span></p>
  </main>


  <script src="revers/script_debut.js"></script>
</body>
</html>
